---
meta:
  author: "David Scarth"
  description: "Plex library search query must not trigger 932230 or 932250"
# no_match_regex on the positive cases asserts that NO paranoia-level-1 CRS
# rule fired on the legitimate request, so a CRS sibling added later that
# matches the same payload fails the test without listing rule IDs. The
# harness runs DetectionOnly at PL4, so a status assertion would be
# meaningless and PL2-4 rules may fire; the regex is scoped to PL1.
# expect_ids on the scope-control case asserts the CRS rule still matches
# the payload; if it fails, the exclusion may no longer be needed.
rule_id: 9530140
tests:
  - test_id: 1
    desc: "Search text with wrapper + 2-3 char command shape is excluded from 932230 and 932250 on /library/search"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/library/search?query=time%20to%20go%20then%20sh%20into%20the%20box"
        output:
          log:
            no_expect_ids: [932230, 932250]
            no_match_regex: 'id "9[0-9]{5}".*paranoia-level/1'
  - test_id: 2
    desc: "Same search fanned out to a provider-prefixed search path is excluded"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/tv.plex.providers.epg.cloud:10/library/search?query=time%20to%20go%20then%20sh%20into%20the%20box"
        output:
          log:
            no_expect_ids: [932230, 932250]
            no_match_regex: 'id "9[0-9]{5}".*paranoia-level/1'
  - test_id: 3
    desc: "Type-ahead fragment matching 932250 only is excluded"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/library/search?query=sh%20movie"
        output:
          log:
            no_expect_ids: [932250]
            no_match_regex: 'id "9[0-9]{5}".*paranoia-level/1'
  - test_id: 4
    desc: "Ordinary search text does not fire either rule (sanity)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/library/search?query=Dog%20%26%20Cat%20Show"
        output:
          log:
            no_expect_ids: [932230, 932250]
            no_match_regex: 'id "9[0-9]{5}".*paranoia-level/1'
  - test_id: 5
    desc: "Same query parameter on an unrelated path is still inspected by 932230 (scope control)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/library/sections?query=time%20to%20go%20then%20sh%20into%20the%20box"
        output:
          log:
            expect_ids: [932230]
  - test_id: 6
    desc: "Same query parameter on an unrelated path is still inspected by 932250 (scope control)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/library/sections?query=sh%20movie"
        output:
          log:
            expect_ids: [932250]
  - test_id: 7
    desc: "Same search text on the documented /hubs/search endpoint is excluded (spec sibling of /library/search)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/hubs/search?query=time%20to%20go%20then%20sh%20into%20the%20box"
        output:
          log:
            no_expect_ids: [932230, 932250]
            no_match_regex: 'id "9[0-9]{5}".*paranoia-level/1'
