---
meta:
  author: "David Scarth"
  description: "Plex transcode client-profile augmentation must not trigger 932235 or 932370"
# no_match_regex on the positive cases asserts that NO paranoia-level-1 CRS
# rule fired on the legitimate request, so a CRS sibling added later that
# matches the same payload fails the test without listing rule IDs. The
# harness runs DetectionOnly at PL4, so a status assertion would be
# meaningless and PL2-4 rules may fire; the regex is scoped to PL1.
# expect_ids on the scope-control case asserts the CRS rule still matches
# the payload; if it fails, the exclusion may no longer be needed.
rule_id: 9530100
tests:
  - test_id: 1
    desc: "protocol=dash profile on the universal transcoder is excluded from 932235"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/video/:/transcode/universal/start.m3u8?path=%2Flibrary%2Fmetadata%2F1&X-Plex-Client-Profile-Extra=add-transcode-target(type%3DvideoProfile%26context%3Dstreaming%26protocol%3Ddash%26container%3Dmp4%26videoCodec%3Dh264%26audioCodec%3Daac)"
        output:
          log:
            no_expect_ids: [932235]
            no_match_regex: 'id "9[0-9]{5}".*paranoia-level/1'
  - test_id: 2
    desc: "add-limitation(...&replace=true) profile on the /decision endpoint is excluded from 932370 (real Android TV transcode)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/video/:/transcode/universal/decision?path=%2Flibrary%2Fmetadata%2F24890&protocol=*&X-Plex-Client-Profile-Extra=add-limitation(scope%3DvideoCodec%26scopeName%3D*%26type%3DupperBound%26name%3Dvideo.width%26value%3D3840%26replace%3Dtrue)"
        output:
          log:
            no_expect_ids: [932370]
            no_match_regex: 'id "9[0-9]{5}".*paranoia-level/1'
  - test_id: 3
    desc: "Same &replace payload in X-Plex-Client-Profile-Extra on an unrelated path is still inspected (scope control)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/library/sections?X-Plex-Client-Profile-Extra=add-limitation(scopeName%3D*%26value%3D1%26replace%3Dtrue)"
        output:
          log:
            expect_ids: [932370]
  - test_id: 4
    desc: "audio transcodeType is excluded"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/audio/:/transcode/universal/start.m3u8?path=%2Flibrary%2Fmetadata%2F1&X-Plex-Client-Profile-Extra=add-transcode-target(type%3DvideoProfile%26context%3Dstreaming%26protocol%3Ddash%26container%3Dmp4%26videoCodec%3Dh264%26audioCodec%3Daac)"
        output:
          log:
            no_expect_ids: [932235]
            no_match_regex: 'id "9[0-9]{5}".*paranoia-level/1'
  - test_id: 5
    desc: "profile on /downloadQueue/{queueId}/add is excluded"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: POST
          uri: "/downloadQueue/1/add?X-Plex-Client-Profile-Extra=add-transcode-target(type%3DvideoProfile%26context%3Dstreaming%26protocol%3Ddash%26container%3Dmp4%26videoCodec%3Dh264%26audioCodec%3Daac)"
        output:
          log:
            no_expect_ids: [932235]
            no_match_regex: 'id "9[0-9]{5}".*paranoia-level/1'
