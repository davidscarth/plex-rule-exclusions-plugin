# OWASP CRS Plugin
# Plugin name: plex-rule-exclusions-plugin
# Plugin description: Rule exclusions Plex Media Server needs to run behind
#                     CRS at paranoia level 1 without breaking playback,
#                     search, thumbnails or client log uploads
# Rule ID block: 9,530,000-9,530,999
# Plugin version: 1.0.0

# Documentation can be found here:
# https://github.com/davidscarth/plex-rule-exclusions-plugin

# Generic rule to disable plugin
SecRule TX:plex-rule-exclusions-plugin_enabled "@eq 0" "id:9530099,phase:1,pass,nolog,ctl:ruleRemoveById=9530100-9530999"

# Scoping (see -config file). Active only when
# tx.plex-rule-exclusions-plugin_hosts is set: three tokens (/name/,
# /name:port/, /:port/) are built from the Host header and SERVER_PORT, and
# every plugin rule is removed unless one of them is in the list. A request
# with no Host header keeps the plugin (over-applying is the safe direction).
#
# 9530089  default the flag to "apply"
# 9530090  build the tokens and reset the flag, only once a Host is parsed
# 9530091-9530093  set the flag if a token is listed
# 9530096  remove the plugin if the list is set and no token matched
SecRule &TX:plex-rule-exclusions-plugin_hosts "@gt 0" \
    "id:9530089,phase:1,pass,nolog,t:none,setvar:'tx.plex-rule-exclusions-plugin_scope_ok=1'"

SecRule &TX:plex-rule-exclusions-plugin_hosts "@gt 0" \
    "id:9530090,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_HEADERS:Host "@rx ^(\[[^\]]+\]|[^:]+)" \
        "t:none,t:lowercase,\
        capture,\
        setvar:'tx.plex-rule-exclusions-plugin_scope_ok=0',\
        setvar:'tx.plex-rule-exclusions-plugin_tok_name=/%{TX.1}/',\
        setvar:'tx.plex-rule-exclusions-plugin_tok_nameport=/%{TX.1}:%{SERVER_PORT}/',\
        setvar:'tx.plex-rule-exclusions-plugin_tok_port=/:%{SERVER_PORT}/'"

SecRule TX:plex-rule-exclusions-plugin_tok_name "@within %{tx.plex-rule-exclusions-plugin_hosts}" \
    "id:9530091,phase:1,pass,nolog,t:none,setvar:'tx.plex-rule-exclusions-plugin_scope_ok=1'"
SecRule TX:plex-rule-exclusions-plugin_tok_nameport "@within %{tx.plex-rule-exclusions-plugin_hosts}" \
    "id:9530092,phase:1,pass,nolog,t:none,setvar:'tx.plex-rule-exclusions-plugin_scope_ok=1'"
SecRule TX:plex-rule-exclusions-plugin_tok_port "@within %{tx.plex-rule-exclusions-plugin_hosts}" \
    "id:9530093,phase:1,pass,nolog,t:none,setvar:'tx.plex-rule-exclusions-plugin_scope_ok=1'"

SecRule &TX:plex-rule-exclusions-plugin_hosts "@gt 0" \
    "id:9530096,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule TX:plex-rule-exclusions-plugin_scope_ok "!@eq 1" \
        "t:none,\
        ctl:ruleRemoveById=9530100-9530999"


# ------------------------------------------------------------------------
# Layout
# ------------------------------------------------------------------------
#
#   9530000-9530099  Initialization (switches, config, scope, gates).
#   9530100-9530199  Rule exclusions. Phase 1, each scoped to one endpoint.
#   9530200-9530499  Unassigned. The companion plex-hardening-plugin uses
#                    the same suffixes for detection (2xx-3xx) and endpoint
#                    denies (4xx), so the two plugins merge by suffix.
#   9530500-9530999  Reserved for a future -after file (response rules),
#                    per the CRS plugin ID convention.


# ------------------------------------------------------------------------
# Notes for operators
# ------------------------------------------------------------------------
#
# All exclusions below were tuned against CRS 4.29.0 at PARANOIA LEVEL 1.
# At PL2 additional sibling rules inspect the same ARGS and the same Plex
# false positives can reappear. Only ARGS-scoped PL2 siblings are relevant;
# header-only PL2 rules (930121, 932131, 932239) never see these query
# parameters. Candidates, per rule:
#
#   9530100  ARGS:X-Plex-Client-Profile-Extra  + 932236, 932371
#            (also plausible: 932231, 932220, 932240, 932281)
#   9530110  ARGS:url                          + 931130, 932371
#   9530120  ARGS:message                      + 932371 (also 932236, 932271)
#
# Re-test with real Plex traffic at PL2 and add only the IDs that fire.
#
# Plex clients send most X-Plex-* values either as request headers or as
# query parameters. These exclusions cover the query-parameter form, which
# is what CRS inspects for the rule families involved.
#
# 9530130 (/media/grabbers) is only useful if tuner traffic is served
# through the proxy. If plex-hardening-plugin is installed with endpoint
# denies enabled (its default), /media/grabbers is dropped in phase 1 by
# its 9531430 and 9530130 never matters.


# ------------------------------------------------------------------------
# 9530100: transcoder profile parameter vs. Unix and Windows RCE (932235,
#          932370)
# ------------------------------------------------------------------------
#
# Clients send add-transcode-target(...protocol=dash&...) and, on the
# /decision endpoint, longer profiles with add-limitation(...&replace=true)
# in the X-Plex-Client-Profile-Extra parameter on the universal transcoder.
# 932235 matches "=dash&" against its Unix command list; 932370 matches
# "&replace" as a Windows command-injection token. Both are the structured
# Plex client-profile DSL, not user input.
#
# 932235 verified 2026-09-15; 932370 confirmed on a live Android TV
# transcode decision 2026-09-27, both against CRS 4.29.0.
#
# The transcoder prefix is the transcodeType enum from the Plex OpenAPI
# spec: video, music, audio, subtitles. /downloadQueue/{queueId}/add is the
# other documented endpoint that takes X-Plex-Client-Profile-Extra.
#
# Enables: transcoded playback (any client) and mobile Downloads.
#
SecRule REQUEST_FILENAME "@rx ^/(?:(?:video|music|audio|subtitles)/:/transcode/universal/|downloadQueue/[^/]+/add$)" \
    "id:9530100,\
    phase:1,\
    pass,\
    nolog,\
    ver:'plex-rule-exclusions-plugin/1.0.0',\
    ctl:ruleRemoveTargetById=932235;ARGS:X-Plex-Client-Profile-Extra,\
    ctl:ruleRemoveTargetById=932370;ARGS:X-Plex-Client-Profile-Extra"


# ------------------------------------------------------------------------
# 9530110: photo transcoder url parameter vs. RFI (931100) and SSRF (934110)
# ------------------------------------------------------------------------
#
# Clients request thumbnails via
#   /photo/:/transcode?url=http://127.0.0.1:32400/library/metadata/...
# 931100 matches the IP-literal URL; 934110 matches 127.0.0.1 from ssrf.data.
#
# The exclusion applies only when the single url value is the server's own
# loopback address (any port: clients copy the port they connected on, and
# :443 has been seen behind a reverse proxy). The documented form of url is
# a server-relative path, which neither rule matches, so documented usage
# is unaffected. A url pointing at any other host stays inspected.
#
# Verified 2026-09-15 against CRS 4.29.0; loopback condition added 2026-10-01.
#
# Enables: thumbnails and poster art in every client.
#
SecRule REQUEST_FILENAME "@streq /photo/:/transcode" \
    "id:9530110,\
    phase:1,\
    pass,\
    nolog,\
    ver:'plex-rule-exclusions-plugin/1.0.0',\
    chain"
    SecRule &ARGS:url "@eq 1" \
        "t:none,\
        chain"
        SecRule ARGS:url "@rx ^https?://(?:127\.0\.0\.1|localhost|\[::1\])(?::\d{1,5})?/" \
            "t:none,t:lowercase,\
            ctl:ruleRemoveTargetById=931100;ARGS:url,\
            ctl:ruleRemoveTargetById=934110;ARGS:url"


# ------------------------------------------------------------------------
# 9530120: client log upload message parameter vs. Windows RCE (932370)
# ------------------------------------------------------------------------
#
# Clients ship their own log lines to /log?level=...&source=...&message=...
# The message is free text and trips 932370 on ordinary client output.
#
# Verified 2026-09-15 against CRS 4.29.0.
#
# Enables: client-side log messages written to the server log (Plex Web, apps).
#
SecRule REQUEST_FILENAME "@streq /log" \
    "id:9530120,\
    phase:1,\
    pass,\
    nolog,\
    ver:'plex-rule-exclusions-plugin/1.0.0',\
    ctl:ruleRemoveTargetById=932370;ARGS:message"


# ------------------------------------------------------------------------
# 9530130: HDHomeRun tuner discovery uri parameter vs. RFI (931100)
# ------------------------------------------------------------------------
#
# /media/grabbers/tv.plex.grabbers.hdhomerun/devices?uri=http://<lan-ip>/...
# carries the tuner's LAN address, which 931100 treats as an RFI attempt.
# The server also accepts the same uri on the documented add-device call,
# POST /media/grabbers/devices (Plex OpenAPI spec). The hdhomerun path is
# the server proxying the grabber's own API, which has /devices/probe?uri=
# and /devices/discover as well, so the match is a prefix.
#
# Note: set the tuner up from localhost rather than app.plex.tv, otherwise
# Plex fails to configure the built-in EPG during setup.
#
# Verified 2026-06-11 against CRS 4.27.0.
#
# Enables: adding an HDHomeRun tuner for Live TV/DVR.
#
SecRule REQUEST_FILENAME "@rx ^/media/grabbers/(?:tv\.plex\.grabbers\.hdhomerun/)?devices" \
    "id:9530130,\
    phase:1,\
    pass,\
    nolog,\
    ver:'plex-rule-exclusions-plugin/1.0.0',\
    ctl:ruleRemoveTargetById=931100;ARGS:uri"


# ------------------------------------------------------------------------
# 9530140: library search query parameter vs. Unix RCE (932230, 932250)
# ------------------------------------------------------------------------
#
# Free-text search trips two Unix command rules: 932230 (a wrapper or
# separator followed by a 2-3 char command) and 932250 (a direct command,
# including type-ahead fragments like "sh movie"). With only 932230 removed,
# "ls la la" typed into the Plex app crashed the client (observed in
# production 2026-09-26). 932260 does not match and is left in place. Plex
# fans each search out to /library/search and
# /tv.plex.providers.<provider>/library/search; the regex covers both.
#
# Verified 2026-09-26 against CRS 4.29.0.
#
# Enables: typing in the search box (local library and online providers).
#
SecRule REQUEST_FILENAME "@rx ^(?:/tv\.plex\.providers\.[^/]+)?/library/search$" \
    "id:9530140,\
    phase:1,\
    pass,\
    nolog,\
    ver:'plex-rule-exclusions-plugin/1.0.0',\
    ctl:ruleRemoveTargetById=932230;ARGS:query,\
    ctl:ruleRemoveTargetById=932250;ARGS:query"


# ------------------------------------------------------------------------
# 9530150: session terminate sessionId parameter name vs. session fixation
#          (943110, 943120)
# ------------------------------------------------------------------------
#
# The owner's "stop playback" control sends ?sessionId=<playback key>&reason=.
# Both rules key on the parameter NAME (ARGS_NAMES, t:lowercase), so the
# target is ARGS_NAMES. 943120 fires when there is no Referer (native apps);
# 943110 fires with an off-domain Referer (Plex Web sends app.plex.tv).
# sessionId here is a playback identifier, not an auth session, and the
# endpoint is owner-only (403 to shared tokens).
#
# Verified 2026-09-26 against CRS 4.29.0.
#
# Enables: the owner's "Stop playback" control in Dashboard/Activity.
#
SecRule REQUEST_FILENAME "@streq /status/sessions/terminate" \
    "id:9530150,\
    phase:1,\
    pass,\
    nolog,\
    ver:'plex-rule-exclusions-plugin/1.0.0',\
    ctl:ruleRemoveTargetById=943110;ARGS_NAMES:sessionId,\
    ctl:ruleRemoveTargetById=943120;ARGS_NAMES:sessionId"


# ------------------------------------------------------------------------
# 9530160: library browse filters (Plex Web "Filter" panel)
# ------------------------------------------------------------------------
#
# Advanced Filters send string-field conditions as query parameters on
# /library/sections/{id}/all. The field is "title", optionally prefixed by a
# hierarchy level (show., episode., artist., album., track.), with the
# operator inside the parameter NAME and inconsistently encoded (title!=,
# title!%3D=, ...). The value is free text, so "ls" or "sh" matches 932250.
# Observed 2026-10-01 on Plex Web 4.162.1, CRS 4.29.0: title!=ls,
# title!%3D=sh, show.title=ls. 932230 has not been seen here.
#
# Removes the whole rule on this one endpoint, the plugin's only
# ruleRemoveById against a CRS rule: a regex target key would be narrower,
# but libmodsecurity will not load one. Other parameters here are
# Plex-generated, studio and editionTitle (the other free-text fields) fall
# inside incidentally, and every other 932 rule still inspects the request.
#
# Enables: library Advanced Filters on Title (Plex Web Filter panel).
#
SecRule REQUEST_FILENAME "@rx ^/library/sections/\d+/all$" \
    "id:9530160,\
    phase:1,\
    pass,\
    nolog,\
    ver:'plex-rule-exclusions-plugin/1.0.0',\
    ctl:ruleRemoveById=932250"


# ------------------------------------------------------------------------
# 9530170: artwork upload from a file
# ------------------------------------------------------------------------
#
# Uploading artwork from a file POSTs the raw image bytes to
# /library/metadata/{id}/posters, /arts, /clearLogos, /squareArts under a
# form content type, so the engine parses the image as form data and 920250
# (UTF-8 validation of ARGS; active only when
# tx.crs_validate_utf8_encoding=1) rejects the bytes. Observed 2026-10-02 on
# Plex Web 4.162.1, CRS 4.29.0, with JPG and BMP on all four paths.
#
# An image is not form data and nothing in CRS inspects image content, so
# the body is not read (ctl:requestBodyAccess=Off; it still streams to
# Plex). The path, query (including url=) and headers stay inspected.
#
# Paths: the four observed plural endpoints plus the spec's singular
# {element} forms. Single id only; widen to \d+(?:,\d+)* if a batch upload
# is ever seen.
#
# Enables: uploading artwork from a file (posters, backgrounds, logos).
#
SecRule REQUEST_METHOD "@rx (?i)^post$" \
    "id:9530170,\
    phase:1,\
    pass,\
    nolog,\
    ver:'plex-rule-exclusions-plugin/1.0.0',\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/library/metadata/\d+/(?:posters?|arts?|clearLogos?|squareArts?|banners?|themes?|thumb)$" \
        "t:none,\
        ctl:requestBodyAccess=Off"


# ------------------------------------------------------------------------
# 9530180: subtitle upload from a file
# ------------------------------------------------------------------------
#
# Plex Web POSTs a subtitle file as the raw body of
# /library/metadata/{id}/subtitles (the spec documents this) with
# Content-Type: text/plain, which CRS does not allow, so 920420 drops it.
# Observed 2026-10-02 on Plex Web 4.162.1, CRS 4.29.0, with ASCII, UTF-8
# and CP1252 .srt files on a movie and an episode.
#
# 920420's one target is removed for this POST (rather than editing
# tx.allowed_request_content_type, which would copy CRS's list), and the
# body is not read, so subtitle text is never parsed as form data. Single
# id only, as in 9530170.
#
# Enables: uploading a subtitle file in Plex Web.
#
SecRule REQUEST_METHOD "@rx (?i)^post$" \
    "id:9530180,\
    phase:1,\
    pass,\
    nolog,\
    ver:'plex-rule-exclusions-plugin/1.0.0',\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/library/metadata/\d+/subtitles$" \
        "t:none,\
        ctl:ruleRemoveTargetById=920420;REQUEST_HEADERS:Content-Type,\
        ctl:requestBodyAccess=Off"
