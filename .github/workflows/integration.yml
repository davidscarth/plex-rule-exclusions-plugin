---
on: [push, pull_request]          # yamllint disable-line rule:truthy
name: Integration tests

permissions: 
  contents: read

jobs:
  integration-tests:
    uses: coreruleset/crs-plugin-test-action/.github/workflows/integration.yaml@81cb7f29881911c56f33a82d1e25dc26e0e13636 # v3.0.2
    with:
      # Test-only setting, loaded as additional CRS setup before the plugin:
      # turn on UTF-8 validation (920250), which is off in CRS by default, so
      # 9530170.yaml exercises the rule it excludes.
      crs-config: |
        SecAction "id:9001001,phase:1,pass,nolog,setvar:'tx.crs_validate_utf8_encoding=1'"
